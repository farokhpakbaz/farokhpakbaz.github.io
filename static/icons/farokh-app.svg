<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Farokh systems and signals</title>
  <desc id="desc">Code brackets surrounding a three-bar signal on a dark green field</desc>
  <defs>
    <radialGradient id="background" cx="50%" cy="42%" r="72%">
      <stop offset="0" stop-color="#122719"/>
      <stop offset="1" stop-color="#050907"/>
    </radialGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9ff9e"/>
      <stop offset="1" stop-color="#74d65f"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#background)"/>
  <rect x="76" y="76" width="360" height="360" rx="88" fill="#080d0a" stroke="#324039" stroke-width="4"/>
  <path d="m194 174-72 82 72 82M318 174l72 82-72 82" fill="none" stroke="#b7f774" stroke-width="22" stroke-linecap="square" stroke-linejoin="round"/>
  <g fill="url(#signal)" filter="url(#glow)">
