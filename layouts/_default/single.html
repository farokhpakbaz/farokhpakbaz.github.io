{{ define "main" }}
<article class="article">
  <header class="article-header">
    <a class="back-link" href="{{ if eq .Section "notes" }}{{ "notes/" | relURL }}{{ else }}{{ site.Home.RelPermalink }}{{ end }}">← back</a>
    {{ if eq .Section "notes" }}<time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "02 January 2006" }} · {{ .ReadingTime }} min read</time>{{ end }}
    <h1>{{ .Title }}<span class="punctuation">.</span></h1>
    {{ with .Description }}<p class="article-deck">{{ . }}</p>{{ end }}
  </header>
  <div class="prose">
    {{ .Content }}
  </div>
</article>
{{ end }}
