{{ define "main" }}
<header class="page-header">
  <p class="section-index">~/{{ .Section }}</p>
  <h1>{{ .Title }}<span class="punctuation">.</span></h1>
  {{ with .Content }}<div class="page-intro">{{ . }}</div>{{ end }}
</header>
<section class="archive" aria-label="{{ .Title }} archive">
  {{ range .Pages.ByDate.Reverse }}
  <article class="archive-row">
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006.01.02" }}</time>
    <div>
      <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
      <p>{{ .Description }}</p>
    </div>
    <a class="archive-arrow" href="{{ .RelPermalink }}" aria-label="Read {{ .Title }}">→</a>
  </article>
  {{ end }}
</section>
{{ end }}
