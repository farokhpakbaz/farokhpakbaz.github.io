{{- $episodes := partialCached "focus-episodes.html" . "focus-episodes-v1" -}}
<aside
  class="focus-player"
  id="focus-player"
  data-player
  hidden
  aria-label="musicForProgramming focus player"
>
  <div class="player-titlebar">
    <p><span>musicForProgramming</span>(<q>focus</q>);</p>
    <div class="player-titlebar__actions">
      <button type="button" data-player-minimize aria-label="Minimize focus radio" title="Minimize">−</button>
      <button type="button" data-player-close aria-label="Stop and close focus radio" title="Stop and close">×</button>
    </div>
  </div>

  <div class="player-mini" data-player-mini>
    <button class="player-mini__now" type="button" data-player-expand aria-label="Expand focus radio">
      <span class="player-mini__signal" aria-hidden="true"><i></i><i></i><i></i></span>
      <span>
        <small>focus radio</small>
        <strong data-player-mini-title>{{ (index $episodes 0).title }}</strong>
      </span>
    </button>
    <div class="player-mini__controls">
      <button type="button" data-player-prev aria-label="Previous episode">|←</button>
      <button class="player-mini__play" type="button" data-player-play aria-label="Play">
        <span data-play-icon aria-hidden="true">▶</span>
      </button>
      <button type="button" data-player-next aria-label="Next episode">→|</button>
      <button type="button" data-player-expand aria-label="Expand focus radio" title="Expand">↗</button>
      <button type="button" data-player-close aria-label="Stop and close focus radio" title="Stop and close">×</button>
    </div>
  </div>

  <div class="player-display">
    <div class="visualizer" data-visualizer aria-hidden="true">
      {{ range seq 28 }}<i></i>{{ end }}
    </div>
    <p class="player-kicker">NOW STREAMING</p>
    <p class="player-title" data-player-title>{{ (index $episodes 0).title }}</p>
    <p class="player-status" data-player-status>ready when you are</p>
  </div>

  <label class="episode-picker">
    <span>episode</span>
    <select data-episode-select aria-label="Choose an episode">
      {{- range $index, $episode := $episodes }}
      <option value="{{ $index }}">{{ replaceRE `^Episode\s+([0-9]+):\s*` "$1 · " $episode.title }}</option>
      {{- end }}
    </select>
  </label>

  <div class="player-controls">
    <button type="button" data-player-prev aria-label="Previous episode">
      |←
    </button>
    <button
      class="play-button"
      type="button"
      data-player-play
      aria-label="Play"
    >
      <span data-play-icon aria-hidden="true">PLAY</span>
    </button>
    <button type="button" data-player-next aria-label="Next episode">→|</button>
    <button type="button" data-player-rewind aria-label="Rewind 30 seconds">
      −30
    </button>
    <button type="button" data-player-forward aria-label="Forward 30 seconds">
      +30
    </button>
  </div>

  <div class="player-timeline">
    <span data-current-time>00:00</span>
    <input
      type="range"
      data-player-progress
      min="0"
      max="1000"
      value="0"
      aria-label="Playback position"
    />
    <span data-duration>--:--</span>
  </div>

  <div class="player-footer">
    <div class="player-footer__controls">
      <label
        ><span>vol</span
        ><input
          type="range"
          data-player-volume
          min="0"
          max="1"
          step="0.05"
          value="0.8"
          aria-label="Volume"
      /></label>
      <label class="player-sleep">
        <span>sleep</span>
        <select data-player-sleep aria-label="Sleep timer">
          <option value="off">off</option>
          <option value="15">15 min</option>
          <option value="30">30 min</option>
          <option value="60">60 min</option>
          <option value="episode">end of episode</option>
        </select>
      </label>
    </div>
    <a href="https://musicforprogramming.net" target="_blank" rel="noopener"
      >source: musicforprogramming.net ↗</a
    >
  </div>

  <audio data-player-audio preload="metadata"></audio>
</aside>
<script type="application/json" data-player-episodes>
  {{- $episodes | jsonify | safeJS -}}
</script>
