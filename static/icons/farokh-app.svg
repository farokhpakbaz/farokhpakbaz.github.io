    <rect x="253" y="184" width="18" height="144" rx="9"/>
    <rect x="282" y="232" width="18" height="48" rx="9"/>
  </g>
  <g fill="#72ff93" opacity=".38">
    <circle cx="114" cy="112" r="5"/><circle cx="398" cy="128" r="5"/>
    <circle cx="128" cy="402" r="5"/><circle cx="384" cy="394" r="5"/>
