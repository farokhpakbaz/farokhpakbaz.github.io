{{ define "main" }}
<header class="page-header">
  <p class="section-index">~/{{ .Section }}</p>
  <h1>{{ .Title }}<span class="punctuation">.</span></h1>
  {{ with .Content }}<div class="page-intro">{{ . }}</div>{{ end }}
</header>
<section class="archive" aria-label="{{ .Title }} archive">
  {{ range .Pages.ByDate.Reverse }}
  <a class="archive-row" href="{{ .RelPermalink }}">
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006.01.02" }}</time>
    <div>
      <h2>{{ .Title }}</h2>
      <p>{{ .Description }}</p>
    </div>
    <span class="archive-arrow" aria-hidden="true">→</span>
  </a>
  {{ end }}
</section>
{{ end }}
